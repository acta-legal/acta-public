<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Acta favicon — KEYHOLE cut, theme-aware (dark browsers get the paper version).
       The delivered brand-v2 export shipped the geometry with no fill and no style
       block, which renders pure black and all but vanishes on a dark tab strip. The
       geometry below is the delivered one, untouched; only the adaptive fill the
       brand-v2 README specifies has been restored. -->
  <style>
    path { fill: #17233B; }
    @media (prefers-color-scheme: dark) { path { fill: #F4F6FA; } }
  </style>
